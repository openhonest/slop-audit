# Pre-commit hooks for the Slop Audit repository.
# Modifying hooks are scoped to the L1 analyzer so the Markdown specification
# tree is not reformatted. check-yaml validates the whole repo (workflows too).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: ^tools/l1_analyzer/.*\.(py|toml)$
      - id: end-of-file-fixer
        files: ^tools/l1_analyzer/.*\.(py|toml)$
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^tools/l1_analyzer/.*\.py$

  # Dogfood: run the Slop Audit against its own analyzer. Fails the commit if the tool
  # would flag this repo's code on a bright-line invariant (a production god-file, or
  # promiscuous state that breaks exhaustive testability). Runs only when analyzer
  # Python changes; audits the whole repo, so pass_filenames is off.
  - repo: local
    hooks:
      # The function-point invariant: every module-level function carries exactly one gherkin
      # scenario named after it. Ported from honest-framework/python/feature-gate.sh. The
      # framework holds 96% one-scenario-per-function because that gate refuses the next
      # commit; this analyzer sat at 16% because nothing ever asked. Affected-only: it checks
      # the modules whose source or feature file is staged.
      - id: feature-gate
        name: feature gate (one gherkin scenario per function)
        entry: tools/l1_analyzer/feature-gate.sh
        language: system
        pass_filenames: false
        files: ^tools/l1_analyzer/(l1_analyzer/.*\.py|features/.*\.feature)$

      - id: slop-audit-self
        name: slop audit (dogfood - god-files + finite-testability + type-escape and Honest Code ratchets)
        # --max-type-escapes is the Any / # type: ignore baseline: a new escape fails
        # the commit. Lower it as escapes are typed away; raising it is a deliberate,
        # reviewable change here in the config.
        # --max-honest-code is the L1.21 baseline. This package is not at a hundred per
        # cent, so a bright line would block every commit; the ratchet fails a NEW clause
        # finding instead. Nothing enforced L1.21 here until 2026-08-23: it ran only when
        # somebody typed the command, which is the condition under which a number drifts.
        # Lower it as findings are fixed or declared; raising it is a deliberate change here.
        #
        # 45, not the 24 in the analyzer package. Running the check by hand had only ever
        # covered l1_analyzer, so the other Python in this repository had never been
        # measured against L1.21 at all: the Rust bundle's helper scripts, ui-audit, the
        # paper arms, edit-replay and variance-decomposition carry 21 findings between them.
        entry: uv run --project tools/l1_analyzer slop-audit-l1 . --gate --max-type-escapes 0 --max-honest-code 36
        language: system
        pass_filenames: false
        files: ^tools/l1_analyzer/.*\.py$

      # Reference: the meter's verdict on honest-framework's reference server (a
      # vendored, verbatim snapshot) must stay a clean bill. Guards against a
      # classifier change silently re-dirtying the reference implementation - it is
      # how the app.get(path)(handler) false positive would have been caught.
      - id: slop-audit-reference
        name: slop audit reference (meter vs honest-framework reference server)
        entry: uv run --project tools/l1_analyzer --extra dev pytest tools/l1_analyzer/tests/test_reference_honest_framework.py -q
        language: system
        pass_filenames: false
        files: ^tools/l1_analyzer/.*\.py$
