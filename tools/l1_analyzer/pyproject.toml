[project]
name = "slop-audit-l1"
version = "0.1.0"
description = "Reference Python implementation of Slop Audit Layer 1 indicators (L1.1-L1.20). Language-agnostic where possible; tree-sitter based for source analysis (Python, Rust, C, and extensible to Java/TS/C# etc.)."
authors = [{ name = "Open Honest Foundation" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "tree-sitter-rust>=0.24",
    "tree-sitter-c>=0.24",
    # Add more parsers as needed: tree-sitter-java, tree-sitter-typescript, tree-sitter-c-sharp
    "tree-sitter-java>=0.23.5",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-c-sharp>=0.23.5",
]

[project.scripts]
l1-analyzer = "l1_analyzer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-bdd>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["l1_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/features"
