[project]
name = "slop-audit-l1"
version = "1.0.0"
description = "Reference Python implementation of Slop Audit Layer 1 indicators (L1.1-L1.20). Language-agnostic where possible; tree-sitter based for source analysis (Python, Java, JavaScript, TypeScript, C#, Ruby, Go, Rust, C)."
authors = [{ name = "Open Honest Foundation" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "tree-sitter-rust>=0.24",
    "tree-sitter-c>=0.24",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "jinja2>=3.1",
    "tree-sitter-html>=0.23.2",
    "tree-sitter-css>=0.25.0",
]

[project.scripts]
slop-audit-l1 = "l1_analyzer.cli:run"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-bdd>=7.0", "coverage>=7.0", "pytest-randomly>=3.15"]
# The --prove stage generates tests with a model; the static core stays zero-LLM.
prove = ["anthropic>=0.40"]
# --prove-coverage runs slop-audit's own coverage-gap proof loop (native locate via
# rust_facets + rust_trace, model proposal, in-crate cargo-test execution). It needs only
# the model client here; cargo + cargo-llvm-cov are external tools. No Umbra dependency.
coverage-prove = ["anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["l1_analyzer"]

# Writes l1_analyzer/_build.py with the commit this wheel came from. `custom` is one of
# hatchling's own hooks, so naming the build costs no new dependency.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# bdd_features_base_dir is deliberately unset. pytest-bdd resolves it against the
# rootdir, so setting it made every scenarios() call depend on where pytest was
# invoked from - the reason the old BDD README told readers not to run the suite
# from the repository root. Unset, pytest-bdd resolves a relative feature path
# against the step-definition module's own directory, so tests/bdd/step_defs/*.py
# find tests/bdd/features/*.feature from any working directory.
markers = [
    "python: scenario exercises the Python grammar",
    "rust: scenario exercises the Rust grammar",
    "c: scenario exercises the C grammar",
    "multi-lang: scenario is asserted across every supported grammar",
]

# Coverage is scoped to the package under audit, not the test scaffolding, so
# decision-space coverage (L1.19) measures the source's branches - the subject
# of the audit - rather than being diluted by branches in the tests themselves.
[tool.coverage.run]
branch = true
source = ["l1_analyzer"]
