[package]
name = "slop-audit-rs"
version = "0.2.0"
edition = "2021"
description = "Portable slop-audit proof: static panel + tree-sitter, validated against the Python reference."

[dependencies]
tree-sitter = "0.25"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.23"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
# A manifest is somebody else's JSON, escapes and nesting and all, and a
# hand-rolled reader of it is a source of quiet wrong answers rather than loud
# ones. The crate is pure Rust and adds a fraction of one of the nine grammars
# this binary already links.
serde_json = "1"
walkdir = "2.5"

[profile.release]
strip = true
lto = true
opt-level = "z"
