# The parity corpus: real repositories the port is validated equal against.
#
# Every entry is pinned to a commit, so a parity run is reproducible and a failure is
# about the tools rather than about upstream moving. Nothing here is vendored into this
# repository; validate_corpus.py clones each one at the pinned commit into a cache
# directory outside the tree.
#
# `lang` is the language the entry exists to exercise. It is checked, not assumed: the
# run passes --lang auto and fails if the tools detect something else, so a repo whose
# file mix drifts is caught rather than silently measuring a different grammar.
#
# Adding an entry: pick a repository that is public, permissively licensed and under
# about 50 MB, resolve its current commit, and add a row. Then run validate_corpus.py
# and commit the result only if every indicator is equal.

