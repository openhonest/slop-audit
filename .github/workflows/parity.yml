name: Parity

# The portable bundle is a certified-equivalent redistribution of the Python reference,
# and that claim is only worth what it is checked against. validate.py runs both tools on
# the same repo and fails on any indicator where they disagree.
#
# The reference is canonical. A parity failure means the port drifted, unless the commit
# deliberately changed the measurement in both, in which case both change together.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  parity:
    name: Rust port equals the Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The git indicators read the log, so a shallow clone would compare two tools
          # on one commit rather than on a history.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync the reference
        run: uv sync --extra dev
        working-directory: tools/l1_analyzer
      - name: Build the bundle
        run: cargo build --release --locked
        working-directory: tools/slop-audit-rs
      # Three in-tree targets: the repo itself and the Python package resolve as python,
      # the crate as rust. Every other language is covered by the corpus job below, which
      # reads the manifest rather than a count written here.
      - name: Diff the panels
        working-directory: tools/slop-audit-rs
        run: |
          set -e
          uv run validate.py "$GITHUB_WORKSPACE"
          uv run validate.py "$GITHUB_WORKSPACE/tools/l1_analyzer"
          uv run validate.py "$GITHUB_WORKSPACE/tools/slop-audit-rs"

  corpus:
    # Every repository pinned in corpus.toml, one per supported language at least. The
    # count is not written here: it said "six, covering Java, C# and C" and the manifest
    # grew to thirteen across nine languages, so the comment was a second copy of a number
    # nobody updates. validate_corpus.py reads the manifest and is the only place that
    # knows how many there are.
    #
    # Cloned in full, because L1.1 through L1.8 read the commit history, so this job is
    # heavier than the one above and does not run on every push.
    name: Parity across the pinned corpus
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync the reference
        run: uv sync --extra dev
        working-directory: tools/l1_analyzer
      - name: Build the bundle
        run: cargo build --release --locked
        working-directory: tools/slop-audit-rs
      - name: Cache the corpus clones
        uses: actions/cache@v4
        with:
          path: ~/.cache/slop-audit-corpus
          # The manifest pins every commit, so its hash is the cache identity: change a
          # pin and the clones are refetched rather than silently reused.
          key: corpus-${{ hashFiles('tools/slop-audit-rs/corpus.toml') }}
      - name: Diff every panel in the corpus
        run: uv run validate_corpus.py
        working-directory: tools/slop-audit-rs
