name: Release binaries

# One self-contained binary per platform, which is the whole point of the Rust bundle: an
# auditor runs the panel from a USB key, with no Python, no install, and no network.
#
# Linux and Windows cross-build from the Linux runner, which carries a rustup toolchain
# that can add targets. Debian needs musl-tools for musl-gcc and mingw-w64 for the Windows
# cross-compiler, because the tree-sitter grammars are C.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux-and-windows:
    name: Linux (static) and Windows
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/slop-audit-rs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install cross-compilers
        run: sudo apt-get update && sudo apt-get install -y musl-tools mingw-w64
      - name: Add targets
        run: rustup target add x86_64-unknown-linux-musl x86_64-pc-windows-gnu
      - name: Build Linux (static-pie, no libc dependency)
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
      - name: Build Windows
        run: cargo build --release --locked --target x86_64-pc-windows-gnu
      - name: Check the Linux binary is genuinely static
        run: file target/x86_64-unknown-linux-musl/release/slop-audit-rs | grep -q "static-pie"
      - name: Record the Linux panel for the cross-platform diff
        run: ./target/x86_64-unknown-linux-musl/release/slop-audit-rs "$GITHUB_WORKSPACE" --tsv > panel-linux.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: slop-audit-rs-x86_64-linux-musl
          path: tools/slop-audit-rs/target/x86_64-unknown-linux-musl/release/slop-audit-rs
      - uses: actions/upload-artifact@v4
        with:
          name: slop-audit-rs-x86_64-windows
          path: tools/slop-audit-rs/target/x86_64-pc-windows-gnu/release/slop-audit-rs.exe
      - uses: actions/upload-artifact@v4
        with:
          name: panel-linux
          path: tools/slop-audit-rs/panel-linux.tsv

  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tools/slop-audit-rs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: cargo build --release --locked
      - name: Record the macOS panel for the cross-platform diff
        run: ./target/release/slop-audit-rs "$GITHUB_WORKSPACE" --tsv > panel-macos.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: slop-audit-rs-aarch64-macos
          path: tools/slop-audit-rs/target/release/slop-audit-rs
      - uses: actions/upload-artifact@v4
        with:
          name: panel-macos
          path: tools/slop-audit-rs/panel-macos.tsv

  cross-platform-agreement:
    # A binary that reports different numbers on a different architecture is not one
    # instrument. Both jobs audit the same commit of this repo and record the panel; this
    # diffs them byte for byte and fails the release if they disagree.
    name: Linux and macOS agree on the same repo
    needs: [linux-and-windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: panel-linux
          path: linux
      - uses: actions/download-artifact@v4
        with:
          name: panel-macos
          path: macos
      - name: Diff the two panels
        run: diff linux/panel-linux.tsv macos/panel-macos.tsv

  publish:
    # Without this the binaries reach the workflow RUN and never the release, which
    # requires a login to download, expires in 90 days, arrives zipped and loses the
    # executable bit. v0.1.0 shipped with zero assets for exactly this reason.
    name: Attach the binaries to the release
    needs: [cross-platform-agreement]
    # workflow_dispatch has no tag, so GITHUB_REF_NAME would be a branch and the upload
    # would fail. Only a tag publishes.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Name each binary for its platform, and checksum them
        run: |
          mkdir out
          cp artifacts/slop-audit-rs-x86_64-linux-musl/slop-audit-rs out/slop-audit-rs-x86_64-linux-musl
          cp artifacts/slop-audit-rs-x86_64-windows/slop-audit-rs.exe out/slop-audit-rs-x86_64-windows.exe
          cp artifacts/slop-audit-rs-aarch64-macos/slop-audit-rs out/slop-audit-rs-aarch64-macos
          chmod +x out/slop-audit-rs-x86_64-linux-musl out/slop-audit-rs-aarch64-macos
          cd out && sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Attach them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
              --title "$GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md \
            || gh release upload "$GITHUB_REF_NAME" out/* --clobber
      - name: Fail the release if it published no assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')
          echo "assets attached: $n"
          test "$n" -ge 4
