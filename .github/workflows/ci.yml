name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: L1 analyzer tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/l1_analyzer
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Run test suite
        run: uv run pytest -q

  lint:
    name: Ruff + pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure
