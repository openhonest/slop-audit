name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: L1 analyzer tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/l1_analyzer
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Run test suite
        run: uv run pytest -q

  lint:
    name: Ruff + pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure

  dogfood:
    name: Slop Audit self-panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/l1_analyzer
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, deliberately. L1.1 through L1.8 read `git log`, and the
          # default shallow checkout would hand them one commit and make eight of the
          # twenty indicators meaningless without saying so.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --extra dev
      # The pre-commit gate runs three checks. This runs all twenty and fails when the
      # panel gets WORSE than the recorded baseline, which is a ratchet rather than a
      # bar: this repository is honestly Slop on L1.5 and L1.6 today.
      - name: Run the full Layer 1 panel against this repository
        run: uv run python scripts/self_audit.py
