name: Secret scan

# L1.14's good pattern, applied to this repo: "A secret scanner runs in CI and blocks
# merges that introduce credential-shaped strings." A methodology that asks for it and
# does not run it is worth less than the sentence it is written in.
#
# gitleaks runs from its published image rather than a pinned release tarball, so the
# ruleset tracks upstream instead of ageing in this file. .gitleaks.toml extends the
# default ruleset with a narrow allowlist for the invented credentials the methodology's
# own antipattern examples exhibit.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Credentials leak on the calendar, not on the commit graph: a rule added upstream
    # next month applies to code that landed last month.
    - cron: '0 6 * * 1'

jobs:
  gitleaks:
    name: gitleaks detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Scan the history, not just the tip: a secret removed in a later commit is
          # still published.
          fetch-depth: 0
      - name: Scan
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose
